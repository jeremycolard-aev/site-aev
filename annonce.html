<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

<style>
  /* --- 1. VARIABLES & RESET --- */
  :root {
    --noir: #111111;
    --gris: #222222;
    --rouge: #D80000;
    --papier: #F4F2EB;
    --creme: #FBF8F0;
    --papier-fonce: #E8E4D9;
    --ocre: #C8860A;
    
    --font-title: 'Playfair Display', serif;
    --font-body: 'Manrope', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    font-family: var(--font-body);
    background-color: transparent; /* Fond transparent pour se fondre dans le site, ou var(--papier) */
    color: var(--gris);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* --- 2. TEXTURE PAPIER (Optionnel si le site l'a déjà, mais ajouté ici par sécurité) --- */
  .texture-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
  }

  /* --- 3. LAYOUT & GRILLE --- */
  .container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 2rem;
    margin-top: 3rem;
  }

  /* --- 4. CARTES (CARDS) --- */
  .card {
    background: white;
    border: 1px solid rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden; /* Pour contenir la ligne rouge */
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.1);
  }

  /* Ligne rouge animée au top */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 0%;
    height: 4px;
    background: var(--rouge);
    transition: width 0.3s ease;
    z-index: 2;
  }

  .card:hover::before {
    width: 100%;
  }

  .card-image-container {
    width: 100%;
    aspect-ratio: 16/10;
    overflow: hidden;
    /* Application du Coin Cassé sur l'image */
    clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); 
    margin-bottom: 1rem;
  }

  .card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .card:hover .card-img {
    transform: scale(1.05);
  }

  .card-content {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .card-date {
    font-family: var(--font-body);
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    font-weight: 700;
    color: var(--ocre);
    margin-bottom: 0.5rem;
  }

  .card-title {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: 1.5rem;
    margin: 0 0 1rem 0;
    color: var(--noir);
    line-height: 1.2;
  }

  .card-desc {
    font-size: 1rem;
    color: var(--gris);
    margin-bottom: 1.5rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Bouton style "Aix en Vue" */
  .btn-card {
    margin-top: auto;
    align-self: flex-start;
    display: inline-block;
    padding: 0.8rem 1.5rem;
    background: transparent;
    border: 2px solid var(--noir);
    color: var(--noir);
    font-family: var(--font-body);
    text-transform: uppercase;
    font-weight: 800;
    font-size: 0.85rem;
    text-decoration: none;
    cursor: pointer;
    /* Coin cassé sur le bouton */
    clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
    transition: all 0.2s ease;
  }

  .btn-card:hover {
    background: var(--rouge);
    border-color: var(--rouge);
    color: white;
    transform: translateY(-2px);
  }

  /* --- 5. FEATURED (Mis en avant) --- */
  .featured-section {
    margin-bottom: 4rem;
  }

  .featured-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    background: var(--creme);
    align-items: center;
    padding: 0; 
  }

  .featured-img-wrap {
    width: 100%;
    height: 100%;
    min-height: 400px;
    clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%);
  }
  
  .featured-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .featured-content {
    padding: 2rem 3rem 2rem 0;
  }

  .featured-tag {
    display: inline-block;
    background: var(--papier-fonce);
    padding: 0.25rem 0.75rem;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 800;
    color: var(--noir);
    margin-bottom: 1rem;
    clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
  }

  .featured-title {
    font-family: var(--font-title);
    font-size: 2.5rem;
    font-weight: 900;
    font-style: italic;
    margin-bottom: 1rem;
    color: var(--noir);
  }

  /* --- 6. LOADER --- */
  .loader-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--papier-fonce);
    border-top: 4px solid var(--rouge);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 1rem;
  }
  .loader-text {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.8rem;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  /* --- 7. MODAL --- */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(17, 17, 17, 0.9); /* Noir presque opaque */
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.active {
    display: flex;
    opacity: 1;
  }

  .modal-content {
    background: var(--papier);
    width: 90%;
    max-width: 800px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    padding: 0;
    /* Coin cassé subtil sur la modale */
    clip-path: polygon(0 0, 100% 0, 100% 98%, 98% 100%, 0 100%);
  }

  .modal-header {
    position: relative;
  }

  .close-btn {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: var(--rouge);
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    font-weight: bold;
    font-size: 1.5rem;
    cursor: pointer;
    clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .modal-body {
    padding: 3rem;
  }

  .modal-body h2 {
    font-family: var(--font-title);
    font-size: 2.5rem;
    margin-top: 0;
    color: var(--noir);
  }

  .modal-img {
    width: 100%;
    height: auto;
    max-height: 400px;
    object-fit: cover;
    margin-bottom: 2rem;
    display: block;
  }

  /* --- RESPONSIVE --- */
  @media (max-width: 768px) {
    .featured-card {
      grid-template-columns: 1fr;
    }
    .featured-img-wrap {
      min-height: 250px;
      clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%);
    }
    .featured-content {
      padding: 1.5rem;
    }
    .featured-title { font-size: 2rem; }
    
    .grid {
      grid-template-columns: 1fr; /* Une seule colonne sur mobile */
    }
  }
</style>
</head>
<body>

<div class="texture-overlay"></div>

<div class="container">
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div class="loader-text">Récupération des actualités...</div>
    </div>

    <div id="featured-container" class="featured-section"></div>

    <div id="grid" class="grid"></div>
</div>

<div id="modal-view" class="modal-overlay" onclick="if(event.target === this) closeModal()">
  <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modal-inner"></div>
  </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwP_mfqY_V-q23bCeajm0nSOWL9kSFyq8w-lqZouPCCmsZEsBbVCmcuU_bbxj0KH2iBuQ/exec";

    document.addEventListener('DOMContentLoaded', function() {
        fetchData();
    });

    async function fetchData() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            renderPage(data);
        } catch (error) {
            console.error("Erreur :", error);
            document.getElementById('loader').innerHTML = "<div style='color:var(--rouge)'>Erreur de chargement. Vérifiez que le script est déployé en 'Anyone'.</div>";
        }
    }

    function renderPage(data) {
        document.getElementById('loader').style.display = 'none';
        const grid = document.getElementById('grid');
        const featuredContainer = document.getElementById('featured-container');
        
        if (!data || data.length === 0) {
             grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; font-family:var(--font-title); font-style:italic;">Aucune actualité disponible.</div>';
             return;
        }

        // Le premier élément est "Featured"
        renderFeatured(data[0], featuredContainer);
        
        // Les suivants vont dans la grille
        if (data.length > 1) {
            data.slice(1).forEach(item => renderGridCard(item, grid));
        }
    }

    function getImageUrl(photoId) {
        if (!photoId) return 'https://via.placeholder.com/800x600/E8E4D9/111111?text=Aix+en+Vue';
        // Utilisation du lien direct Google Drive pour les images
        return `https://lh3.googleusercontent.com/d/${photoId}`; 
    }

    function renderFeatured(item, container) {
        const imageUrl = getImageUrl(item.photoId);
        
        const html = `
            <article class="featured-card">
                <div class="featured-img-wrap">
                    <img src="${imageUrl}" alt="${item.title}" loading="lazy">
                </div>
                <div class="featured-content">
                    <span class="featured-tag">À la une</span>
                    <h2 class="featured-title">${item.title}</h2>
                    <p style="margin-bottom: 2rem;">${item.description.substring(0, 150)}...</p>
                    <button class="btn-card" onclick='openModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
                        Lire l'article
                    </button>
                </div>
            </article>
        `;
        container.innerHTML = html;
    }

    function renderGridCard(item, container) {
        const imageUrl = getImageUrl(item.photoId);
        const card = document.createElement('article');
        card.className = 'card';
        
        card.innerHTML = `
            <div class="card-image-container">
                <img src="${imageUrl}" class="card-img" alt="${item.title}" loading="lazy">
            </div>
            <div class="card-content">
                <div class="card-date">${item.date}</div>
                <h3 class="card-title">${item.title}</h3>
                <p class="card-desc">${item.description}</p>
                <button class="btn-card" onclick='openModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
                    Découvrir
                </button>
            </div>
        `;
        container.appendChild(card);
    }

    // --- Modal Logic ---
    function openModal(item) {
        const modal = document.getElementById('modal-view');
        const content = document.getElementById('modal-inner');
        const imageUrl = getImageUrl(item.photoId);

        content.innerHTML = `
            <div style="width:100%; height:300px; overflow:hidden;">
               <img src="${imageUrl}" class="modal-img" alt="${item.title}" style="object-fit:cover; width:100%; height:100%;">
            </div>
            <div class="modal-body">
                <div style="color:var(--ocre); font-weight:bold; text-transform:uppercase; margin-bottom:1rem;">${item.date}</div>
                <h2>${item.title}</h2>
                <div style="font-size:1.1rem; color:var(--gris); white-space: pre-wrap;">${item.description}</div>
            </div>
        `;
        
        modal.classList.add('active');
        document.body.style.overflow = 'hidden'; // Empêche le scroll background
    }

    function closeModal() {
        const modal = document.getElementById('modal-view');
        modal.classList.remove('active');
        document.body.style.overflow = 'auto';
    }
</script>

</body>
</html>
</html>
