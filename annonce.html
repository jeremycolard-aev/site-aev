<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aix en Vue - Nos Articles</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

    <style>
      /* --- 2. VARIABLES & DESIGN SYSTEM --- */
      :root {
        /* Palette */
        --noir: #111111;
        --gris: #222222;
        --rouge: #D80000;
        --papier: #F4F2EB;
        --creme: #FBF8F0;
        --papier-fonce: #E8E4D9;
        --ocre: #C8860A;
        
        /* Typo */
        --font-title: 'Playfair Display', serif;
        --font-body: 'Manrope', sans-serif;

        /* Formes */
        --clip-standard: polygon(0 0, 100% 0, 98% 100%, 2% 100%);
        --clip-image: polygon(0 0, 100% 0, 95% 95%, 5% 100%);
      }

      /* --- 3. GLOBAL & TEXTURE PAPIER --- */
      body {
        background-color: var(--papier);
        color: var(--gris);
        font-family: var(--font-body);
        margin: 0; padding: 0;
        line-height: 1.6;
        overflow-x: hidden;
      }

      /* Simulation Texture Papier (Grain) via CSS pur */
      body::before {
        content: "";
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 9999;
        opacity: 0.6;
      }

      /* --- 4. LAYOUT --- */
      .aix-container {
        max-width: 1300px;
        margin: 0 auto;
        padding: 6rem 2rem; /* Desktop padding */
        position: relative;
        z-index: 1;
      }

      /* Header de section */
      .section-header {
        text-align: center;
        margin-bottom: 5rem;
      }

      .eyebrow {
        font-family: var(--font-body);
        font-weight: 800;
        font-size: 0.9rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ocre);
        display: block;
        margin-bottom: 1rem;
      }

      h1.main-title {
        font-family: var(--font-title);
        font-weight: 900;
        font-style: italic;
        font-size: 3.5rem;
        color: var(--noir);
        margin: 0;
        line-height: 1.1;
      }

      /* --- 5. GRID & CARDS --- */
      #annonce-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* Standard 3 colonnes */
        gap: 3rem;
      }

      /* Style de la carte */
      .news-card {
        background: #fff;
        display: flex;
        flex-direction: column;
        position: relative;
        /* Utilisation de drop-shadow au lieu de box-shadow pour respecter le clip-path */
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        transition: transform 0.3s ease, filter 0.3s ease;
        cursor: pointer;
        /* Forme Coin Cassé sur le conteneur */
        clip-path: var(--clip-standard);
        height: 100%; /* Uniform height */
      }

      /* Ligne rouge décorative (cachée par défaut) */
      .news-card::after {
        content: "";
        position: absolute; top: 0; left: 0;
        height: 4px; width: 0%;
        background-color: var(--rouge);
        transition: width 0.3s ease;
        z-index: 10;
      }

      /* Hover Effects */
      .news-card:hover {
        transform: translateY(-8px);
        filter: drop-shadow(0 15px 20px rgba(0,0,0,0.1));
      }
      .news-card:hover::after {
        width: 100%;
      }

      /* Image */
      .card-img-wrapper {
        height: 240px;
        overflow: hidden;
        position: relative;
        /* Petit effet coin cassé interne sur l'image */
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 95%);
      }
      
      .card-img-wrapper img {
        width: 100%; height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
      }
      
      .news-card:hover .card-img-wrapper img {
        transform: scale(1.05);
      }

      /* Contenu */
      .card-body {
        padding: 2rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      .card-meta {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--rouge);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.75rem;
      }

      .card-title {
        font-family: var(--font-title);
        font-weight: 700;
        font-size: 1.5rem;
        line-height: 1.2;
        color: var(--noir);
        margin: 0 0 1rem 0;
      }

      .card-excerpt {
        font-family: var(--font-body);
        font-size: 1rem; /* Min 16px for A11Y */
        color: var(--gris);
        line-height: 1.7;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 1.5rem;
      }

      /* Bouton simulé (Lien) */
      .read-more {
        margin-top: auto;
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.9rem;
        color: var(--noir);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .read-more::after {
        content: "→";
        color: var(--rouge);
        font-size: 1.2rem;
        transition: transform 0.2s;
      }
      .news-card:hover .read-more::after {
        transform: translateX(5px);
      }

      /* --- 6. FEATURED (À LA UNE) --- */
      .news-card.featured {
        grid-column: 1 / -1; /* Toute la largeur */
        flex-direction: row;
        min-height: 450px;
        background-color: var(--creme); /* Fond différent */
      }

      .news-card.featured .card-img-wrapper {
        width: 55%;
        height: auto;
        clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%); /* Coupe oblique verticale */
      }

      .news-card.featured .card-body {
        width: 45%;
        justify-content: center;
        padding: 4rem;
      }

      .news-card.featured .card-title {
        font-size: 2.8rem; /* Très gros titre */
        font-style: italic;
      }

      /* --- 7. RESPONSIVE --- */
      @media (max-width: 900px) {
        #annonce-list {
          grid-template-columns: repeat(2, 1fr);
        }
        .news-card.featured .card-title { font-size: 2rem; }
      }

      @media (max-width: 768px) {
        .aix-container { padding: 4rem 1.5rem; }
        
        #annonce-list {
          grid-template-columns: 1fr; /* 1 seule colonne mobile */
        }

        .news-card.featured {
          flex-direction: column;
        }
        .news-card.featured .card-img-wrapper {
          width: 100%; height: 250px;
          clip-path: polygon(0 0, 100% 0, 100% 95%, 0% 100%);
        }
        .news-card.featured .card-body {
          width: auto; padding: 2rem;
        }
        
        h1.main-title { font-size: 2.5rem; }
      }

      /* --- 8. MODAL (Lecture) --- */
      #modal-overlay {
        display: none;
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(17, 17, 17, 0.9); /* Noir presque opaque */
        backdrop-filter: blur(10px);
        z-index: 10000;
        justify-content: center; align-items: center;
        padding: 20px;
      }

      #modal-content {
        background: var(--papier);
        width: 100%; max-width: 800px;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
        /* Coin cassé modal */
        clip-path: polygon(2% 0, 100% 0, 100% 98%, 98% 100%, 0 100%, 0 2%);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      }

      .modal-header-img {
        width: 100%; height: 350px;
        object-fit: cover;
      }

      .modal-body {
        padding: 3rem 4rem;
      }

      .modal-title {
        font-family: var(--font-title);
        font-size: 2.5rem;
        font-weight: 900;
        color: var(--noir);
        margin-top: 0;
        margin-bottom: 0.5rem;
      }

      .modal-meta {
        font-family: var(--font-body);
        color: var(--ocre);
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 2rem;
        border-bottom: 2px solid var(--papier-fonce);
        padding-bottom: 1rem;
      }

      .modal-text {
        font-size: 1.15rem;
        color: var(--gris);
        line-height: 1.8;
      }
      
      /* Close Button accessible */
      .close-btn {
        position: absolute; top: 20px; right: 20px;
        background: var(--rouge); color: white;
        border: none; width: 40px; height: 40px;
        font-size: 1.5rem; font-weight: bold;
        cursor: pointer; z-index: 10;
        display: flex; justify-content: center; align-items: center;
        transition: transform 0.2s;
        /* Petit style coin cassé sur le bouton */
        clip-path: polygon(20% 0, 100% 0, 100% 80%, 80% 100%, 0 100%, 0 20%);
      }
      .close-btn:hover { transform: scale(1.1); }
      .close-btn:focus { outline: 3px solid white; }

      /* Loader */
      #loader { text-align: center; padding: 4rem; }
      .spinner {
        width: 40px; height: 40px;
        border: 4px solid var(--papier-fonce);
        border-top: 4px solid var(--rouge);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem auto;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      @media (max-width: 600px) {
        .modal-body { padding: 2rem; }
        .modal-title { font-size: 1.8rem; }
      }
    </style>
</head>
<body>

<div class="aix-container">
    
    <header class="section-header">
      <span class="eyebrow">Journal</span>
      <h1 class="main-title">Aix en Vue</h1>
      <svg width="100" height="20" viewBox="0 0 100 20" style="margin-top:10px;">
        <path d="M5,15 Q50,5 95,15" stroke="#D80000" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </header>
    
    <div id="loader">
      <div class="spinner"></div>
      <p style="font-weight: 700; color: var(--ocre);">Chargement de l'encre...</p>
      <div id="error-msg" style="color:var(--rouge); display:none;"></div>
    </div>
    
    <div id="annonce-list"></div>

</div>

<div id="modal-overlay" role="dialog" aria-modal="true" onclick="closeModal(event)">
  <div id="modal-content" onclick="event.stopPropagation()"> 
    <button class="close-btn" onclick="hardCloseModal()" aria-label="Fermer l'article">&times;</button>
    <img id="m-img" class="modal-header-img" src="" alt="">
    <div class="modal-body">
      <h2 id="m-title" class="modal-title"></h2>
      <div id="m-meta" class="modal-meta"></div>
      <div id="m-text" class="modal-text"></div>
    </div>
  </div>
</div>

<script>
  // --- CONFIGURATION ---
  // ⚠️ REMPLACEZ CECI PAR VOTRE URL DE DÉPLOIEMENT APP SCRIPT (exec)
  const API_URL = "https://script.google.com/macros/s/AKfycby-ZuAUgLPOBx9Gpd-NnBHqFAF8ujkJKQhmCPVqWTonTrcq-L2KlhCH_nde6MgfVBRw/exec";

  let allAnnonces = [];

  document.addEventListener('DOMContentLoaded', function() {
    fetchData();
    
    // Fermeture modal avec ESC (A11Y)
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            hardCloseModal();
        }
    });
  });

  function fetchData() {
    fetch(API_URL)
      .then(response => {
        if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
        return response.json();
      })
      .then(data => {
        if (data.error) throw new Error(data.message);
        renderAnnonces(data);
      })
      .catch(error => {
        showError(error);
      });
  }

  function renderAnnonces(data) {
    allAnnonces = data;
    const listDiv = document.getElementById('annonce-list');
    document.getElementById('loader').style.display = 'none';

    if (!data || data.length === 0) {
      listDiv.innerHTML = '<p style="text-align:center; font-size:1.2rem;">Aucun article publié.</p>';
      return;
    }

    let html = '';
    data.forEach((ann, index) => {
      // Nettoyage texte pour extrait
      let tempDiv = document.createElement("div");
      tempDiv.innerHTML = ann.contenu;
      let textOnly = tempDiv.textContent || tempDiv.innerText || "";
      
      // La Une (Featured) a plus de texte
      let isFeatured = (index === 0);
      let limit = isFeatured ? 350 : 110;
      let extrait = textOnly.length > limit ? textOnly.substring(0, limit) + "..." : textOnly;
      let featuredClass = isFeatured ? 'featured' : '';

      html += `
        <article class="news-card ${featuredClass}" onclick="openModal(${index})" tabindex="0" onkeypress="handleEnter(event, ${index})">
          <div class="card-img-wrapper">
            <img src="${ann.photoUrl}" alt="${ann.titre}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-meta">
               ${ann.date} • <span style="color:var(--noir)">${ann.auteur}</span>
            </div>
            <h2 class="card-title">${ann.titre}</h2>
            <div class="card-excerpt">${extrait}</div>
            <div class="read-more">Lire l'article</div>
          </div>
        </article>
      `;
    });
    listDiv.innerHTML = html;
  }

  function showError(e) {
    console.error("Erreur:", e);
    const errorDiv = document.getElementById('error-msg');
    document.querySelector('.spinner').style.display = 'none';
    errorDiv.style.display = 'block';
    errorDiv.textContent = "Impossible de récupérer les nouvelles : " + e.message;
  }

  // --- MODAL LOGIC ---
  function openModal(index) {
    const ann = allAnnonces[index];
    if(!ann) return;

    document.getElementById('m-img').src = ann.photoUrl;
    // Ajout alt texte pour accessibilité image modal
    document.getElementById('m-img').alt = "Illustration de l'article : " + ann.titre;
    
    document.getElementById('m-title').textContent = ann.titre;
    
    // Formatage Meta
    let metaHTML = `PAR ${ann.auteur} | LE ${ann.date}`;
    document.getElementById('m-meta').innerHTML = metaHTML;
    
    document.getElementById('m-text').innerHTML = ann.contenu;
    
    const overlay = document.getElementById('modal-overlay');
    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden'; 
    
    // Focus sur le bouton fermer pour l'accessibilité
    setTimeout(() => document.querySelector('.close-btn').focus(), 100);
  }

  function hardCloseModal() {
    document.getElementById('modal-overlay').style.display = 'none';
    document.body.style.overflow = 'auto';
  }

  function closeModal(event) {
    if (event.target.id === 'modal-overlay') hardCloseModal();
  }

  // Permettre l'ouverture au clavier (Accessibilité)
  function handleEnter(e, index) {
      if(e.key === 'Enter') openModal(index);
  }
</script>

</body>
</html>
